openapi: "3.1.0"
info:
  title: ts-moestuin Garden API
  contact:
    name: CDK
    email: cdkmoestuin@pm.me
  license:
    name: GPL-3.0-or-later
    url: https://spdx.org/licenses/GPL-3.0-or-later.html
  version: "1.0.0"
  description: OpenAPI description generated from definition.yaml (beds, plants, properties)
servers:
  - url: https://api.coensmoestuin.nl
security: []
paths:
  /gardens:
    get:
      operationId: listGardens
      summary: List all gardens
      responses:
        '200':
          description: Array of gardens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Garden'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /gardens/{gardenName}:
    get:
      operationId: getGarden
      summary: Get a single garden by name
      parameters:
        - name: gardenName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Garden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Garden'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /gardens/{gardenName}/parts:
    get:
      operationId: listGardenParts
      summary: List all parts in a garden
      parameters:
        - name: gardenName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Array of parts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GardenPart'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /gardens/{gardenName}/parts/{partName}/footprint:
    put:
      operationId: updateGardenPartFootprint
      summary: Update position/size of a single garden part
      parameters:
        - name: gardenName
          in: path
          required: true
          schema:
            type: string
        - name: partName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                part_type:
                  type: string
                  enum: [bed, path, embankment, water_tank, shed, greenhouse]
                footprint:
                  $ref: '#/components/schemas/PlanFootprint'
              required:
                - part_type
                - footprint
      responses:
        '200':
          description: Updated garden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Garden'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /gardens/{gardenName}/parts/{partName}:
    delete:
      operationId: deleteGardenPart
      summary: Delete a single garden part by name
      parameters:
        - name: gardenName
          in: path
          required: true
          schema:
            type: string
        - name: partName
          in: path
          required: true
          schema:
            type: string
        - name: part_type
          in: query
          required: false
          schema:
            type: string
            enum: [bed, path, embankment, water_tank, shed, greenhouse]
      responses:
        '200':
          description: Updated garden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Garden'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /gardens/{gardenName}/beds:
    post:
      operationId: createBed
      summary: Add a bed part to a garden
      parameters:
        - name: gardenName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                bed:
                  $ref: '#/components/schemas/Bed'
              required:
                - bed
      responses:
        '201':
          description: Updated garden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Garden'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /gardens/{gardenName}/beds/{bedName}:
    get:
      operationId: getBed
      summary: Get a single bed by name within a garden
      parameters:
        - name: gardenName
          in: path
          required: true
          schema:
            type: string
        - name: bedName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bed'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: patchBedUniqueProperties
      summary: Patch unique bed properties
      parameters:
        - name: gardenName
          in: path
          required: true
          schema:
            type: string
        - name: bedName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                bed:
                  type: object
                  additionalProperties: false
                  properties:
                    soil:
                      $ref: '#/components/schemas/Soil'
                    mulched:
                      type: boolean
                    growings:
                      type: array
                      items:
                        $ref: '#/components/schemas/Growing'
                  minProperties: 1
              required:
                - bed
      responses:
        '200':
          description: Updated garden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Garden'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /gardens/{gardenName}/beds/{bedName}/growings/{growingIndex}/activities:
    post:
      operationId: addGrowingActivity
      summary: Add an activity to an existing growing in a bed
      parameters:
        - name: gardenName
          in: path
          required: true
          schema:
            type: string
        - name: bedName
          in: path
          required: true
          schema:
            type: string
        - name: growingIndex
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                growing_activity:
                  $ref: '#/components/schemas/GrowingActivity'
              required:
                - growing_activity
      responses:
        '200':
          description: Updated garden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Garden'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /gardens/{gardenName}/paths:
    post:
      operationId: createPath
      summary: Add a path part to a garden
      parameters:
        - name: gardenName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                path:
                  $ref: '#/components/schemas/Path'
              required:
                - path
      responses:
        '201':
          description: Updated garden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Garden'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /gardens/{gardenName}/paths/{pathName}:
    get:
      operationId: getPath
      summary: Get a single path by name within a garden
      parameters:
        - name: gardenName
          in: path
          required: true
          schema:
            type: string
        - name: pathName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Path'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: patchPathUniqueProperties
      summary: Patch unique path properties
      parameters:
        - name: gardenName
          in: path
          required: true
          schema:
            type: string
        - name: pathName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                path:
                  type: object
                  additionalProperties: false
                  properties:
                    path_matter:
                      $ref: '#/components/schemas/PathMatter'
                    branches:
                      type: array
                      items:
                        $ref: '#/components/schemas/Path'
                  minProperties: 1
              required:
                - path
      responses:
        '200':
          description: Updated garden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Garden'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /gardens/{gardenName}/embankments:
    post:
      operationId: createEmbankment
      summary: Add an embankment part to a garden
      parameters:
        - name: gardenName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                embankment:
                  $ref: '#/components/schemas/Embankment'
              required:
                - embankment
      responses:
        '201':
          description: Updated garden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Garden'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /gardens/{gardenName}/embankments/{embankmentName}:
    patch:
      operationId: patchEmbankmentUniqueProperties
      summary: Patch unique embankment properties
      parameters:
        - name: gardenName
          in: path
          required: true
          schema:
            type: string
        - name: embankmentName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                embankment:
                  type: object
                  additionalProperties: false
                  properties:
                    pitch_degrees:
                      type: number
                  minProperties: 1
              required:
                - embankment
      responses:
        '200':
          description: Updated garden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Garden'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /gardens/{gardenName}/water-tanks:
    post:
      operationId: createWaterTank
      summary: Add a water tank part to a garden
      parameters:
        - name: gardenName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                water_tank:
                  $ref: '#/components/schemas/WaterTank'
              required:
                - water_tank
      responses:
        '201':
          description: Updated garden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Garden'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /gardens/{gardenName}/water-tanks/{waterTankName}:
    patch:
      operationId: patchWaterTankUniqueProperties
      summary: Patch unique water tank properties
      parameters:
        - name: gardenName
          in: path
          required: true
          schema:
            type: string
        - name: waterTankName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                water_tank:
                  type: object
                  additionalProperties: false
                  properties:
                    capacity_liters:
                      type: number
                  minProperties: 1
              required:
                - water_tank
      responses:
        '200':
          description: Updated garden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Garden'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /gardens/{gardenName}/sheds:
    post:
      operationId: createShed
      summary: Add a shed part to a garden
      parameters:
        - name: gardenName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                shed:
                  $ref: '#/components/schemas/Shed'
              required:
                - shed
      responses:
        '201':
          description: Updated garden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Garden'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /gardens/{gardenName}/sheds/{shedName}:
    patch:
      operationId: patchShedUniqueProperties
      summary: Patch unique shed properties
      parameters:
        - name: gardenName
          in: path
          required: true
          schema:
            type: string
        - name: shedName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                shed:
                  type: object
                  additionalProperties: false
                  properties:
                    has_workbench:
                      type: boolean
                  minProperties: 1
              required:
                - shed
      responses:
        '200':
          description: Updated garden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Garden'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /gardens/{gardenName}/greenhouses:
    post:
      operationId: createGreenhouse
      summary: Add a greenhouse part to a garden
      parameters:
        - name: gardenName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                greenhouse:
                  $ref: '#/components/schemas/GreenhousePart'
              required:
                - greenhouse
      responses:
        '201':
          description: Updated garden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Garden'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /gardens/{gardenName}/greenhouses/{greenhouseName}:
    patch:
      operationId: patchGreenhouseUniqueProperties
      summary: Patch unique greenhouse properties
      parameters:
        - name: gardenName
          in: path
          required: true
          schema:
            type: string
        - name: greenhouseName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                greenhouse:
                  type: object
                  additionalProperties: false
                  properties:
                    wall_type:
                      $ref: '#/components/schemas/GreenhouseWallType'
                  minProperties: 1
              required:
                - greenhouse
      responses:
        '200':
          description: Updated garden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Garden'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /plants:
    get:
      operationId: listPlants
      summary: List all plant types
      responses:
        '200':
          description: Array of plants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plant'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /plants/{common_name}:
    get:
      operationId: getPlant
      summary: Get plant details by common_name
      parameters:
        - name: common_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /seeds:
    get:
      operationId: listSeeds
      summary: List all seeds
      responses:
        '200':
          description: Array of seeds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Seed'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createSeed
      summary: Create a seed
      description: >
        Creates a seed entry. The combination of plant_id, variant_name,
        webshop_name, and valid_until_year must be unique.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Seed'
      responses:
        '201':
          description: Created seed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seed'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Duplicate seed identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /seeds/{seedIndex}:
    delete:
      operationId: deleteSeed
      summary: Delete seed by index
      parameters:
        - name: seedIndex
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]+$'
      responses:
        '200':
          description: Deleted seed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seed'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webshops:
    get:
      operationId: listWebshops
      summary: List all webshops
      responses:
        '200':
          description: Array of webshops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Webshop'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
    Garden:
      allOf:
        - $ref: '#/components/schemas/PlanFootprint'
        - type: object        
      required:
        - name
        - location
        - hardiness_region
        - humidity
        - temperature_range_c
        - parts
      unevaluatedProperties: false
      properties:
        name:
          type: string
        location:
          $ref: '#/components/schemas/Location'
        hardiness_region:
          $ref: '#/components/schemas/NLHardinessRegion'
        humidity:
          $ref: '#/components/schemas/HumidityRange'
        temperature_range_c:
          $ref: '#/components/schemas/TemperatureRange'
        parts:
          type: array
          items:
            $ref: '#/components/schemas/GardenPart'
    Bed:
      allOf:
        - $ref: '#/components/schemas/PlanFootprint'
        - type: object
      required:
        - part_type
        - name
        - soil
        - mulched
        - growings
      properties:
        part_type:
          type: string
          enum:
            - bed
        name:
          type: string          
        soil:
          $ref: '#/components/schemas/Soil'
        mulched:
          type: boolean
        growings:
          type: array
          items:
            $ref: '#/components/schemas/Growing'
      unevaluatedProperties: false

    Path:
      allOf:
        - $ref: '#/components/schemas/PlanFootprint'
        - type: object
      unevaluatedProperties: false
      properties:
        part_type:
          type: string
          enum:
            - path
        name:
          type: string
        path_matter:
          $ref: '#/components/schemas/PathMatter'
        branches:
          type: array
          items:
            $ref: '#/components/schemas/Path'
      required:
        - part_type
        - name
        - path_matter
        - branches

    Embankment:
      allOf:
        - $ref: '#/components/schemas/Bed'
        - type: object
      unevaluatedProperties: false
      properties:
        part_type:
          type: string
          enum:
            - embankment
        pitch_degrees:
          type: number
      required:
        - part_type
        - pitch_degrees

    CompostBin:
      allOf:
        - $ref: '#/components/schemas/Building'
        - type: object      
      unevaluatedProperties: false
      properties:
        part_type:
          type: string
          enum:
            - compost_bin
        capacity_liters:
          type: number
        parts:
          type: array
          items:
            $ref: '#/components/schemas/CompostBinPart'
      required:
        - part_type
        - capacity_liters
        - parts

    CompostBinPart:
      allOf:
        - $ref: '#/components/schemas/PlanFootprint'
        - type: object        
      unevaluatedProperties: false
      properties:
        fase:
          enum:
            - afval
            - tussenfase
            - compost
      required:
        - fase

    WaterTank:
      allOf:
        - $ref: '#/components/schemas/Building'
        - type: object        
      unevaluatedProperties: false
      properties:
        part_type:
          type: string
          enum:
            - water_tank
        capacity_liters:
